name: "CodeQL"

on:
  push:
    branches:
      - master
      # Fork experimentation: uploads SARIF scoped to your fork Security → Code scanning.
      # Remove this line before proposing this workflow upstream if maintainers dislike it.
      - experimental-codeql-fork
  pull_request:
    branches: [ "master" ]
  # Run manually from the fork Actions tab → CodeQL workflow → Run workflow → pick branch.
  workflow_dispatch:
  schedule:
    - cron: "39 2 * * 6"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ cpp, python ]

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v3.5.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: ${{ matrix.language == 'cpp' || matrix.language == 'python' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          category: "/language:${{ matrix.language }}"
